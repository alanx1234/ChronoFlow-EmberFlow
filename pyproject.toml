[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emberflow"
version = "0.1.0"
description = "Mass-conditioned probabilistic gyrochronology for M dwarfs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alan Xia", email = "alxia@ucsd.edu" },
    { name = "Phil R. Van-Lane", email = "phil.vanlane@mail.utoronto.ca" },
    { name = "Christopher A. Theissen", email = "ctheissen@ucsd.edu" },
]
keywords = ["astronomy", "gyrochronology", "stellar ages", "M dwarfs", "normalizing flows"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    # >=1.6: zuko changed the NSF base-distribution state_dict keys after 1.5
    # (base.loc/base.scale vs base._0/base._1), so older versions cannot load
    # the shipped weights.
    "zuko>=1.6",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

# Installed by `uv sync` automatically (PEP 735), so a fresh clone can run the
# notebooks without any extra flags.
[dependency-groups]
dev = [
    "matplotlib>=3.7",
    "jupyterlab>=4",
    "ipykernel>=6,<7",   # 7.x has a kernel-startup crash on Python 3.13 (AppleFrameworkLoader)
    "pytest>=7",
    "scikit-learn>=1.3",   # scripts/train_final_model.py only; inference needs no sklearn
]

[tool.hatch.build.targets.wheel]
packages = ["src/emberflow"]
